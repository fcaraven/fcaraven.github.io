<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial zoom — Four SHF and KPZ samples</title>
  <link rel="stylesheet" href="../stylesheets/style.css">
  <style>
    .fields { display: grid; gap: 2rem; }
    .fields figure { margin: 0; min-width: 0; }
    .fields figcaption { text-align: center; }
    .fields img { display: block; width: 100%; height: auto; }
    .samples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .panel { display: block; overflow: hidden; }
    .panel img { width: 200%; max-width: none; }
    .kpz .panel img { transform: translateX(-50%); }
    @media (max-width: 640px) { .samples { grid-template-columns: 1fr; } }
  </style>
</head>
